<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Transposer</title>
<meta name="description" content="Transpose chord sheets to any key, instantly. Paste your chords, pick a key or nudge by semitones, and copy the result.">
<meta name="theme-color" content="#0a0a0f">

<!-- Icons -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Open Graph (set absolute URLs once the site has a fixed domain for richest previews) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Chord Transposer">
<meta property="og:description" content="Transpose chord sheets to any key, instantly — paste · pick · play.">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Chord Transposer — transpose chord sheets to any key">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chord Transposer">
<meta name="twitter:description" content="Transpose chord sheets to any key, instantly — paste · pick · play.">
<meta name="twitter:image" content="og-image.png">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --panel: #1a1a26;
    --border: #2a2a3a;
    --accent: #e8c547;
    --accent2: #7c6ef5;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --radius: 10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(16px, 4vw, 40px) clamp(12px, 4vw, 32px);
    overflow-x: hidden;
  }

  /* Subtle grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,110,245,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,110,245,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 820px;
  }

  header {
    text-align: center;
    margin-bottom: clamp(24px, 5vw, 48px);
    animation: fadeDown .5s ease both;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 8vw, 6rem);
    letter-spacing: .06em;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent) 0%, #fff 50%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sub {
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* ── Key Picker ── */
  .section-label {
    font-size: .65rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .key-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
    margin-bottom: 10px;
  }

  .key-btn {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: .8rem;
    padding: 10px 6px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .12s, color .15s;
    text-align: center;
    user-select: none;
    line-height: 1.2;
  }

  .key-btn:hover {
    background: #1e1e30;
    border-color: var(--accent2);
    transform: translateY(-2px);
  }

  .key-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
    font-weight: 500;
    transform: translateY(-2px);
    box-shadow: 0 0 16px rgba(232,197,71,.35);
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: clamp(16px, 4vw, 28px);
    margin-bottom: 20px;
    animation: fadeUp .4s ease both;
  }

  .card:nth-child(2) { animation-delay: .05s; }
  .card:nth-child(3) { animation-delay: .1s; }
  .card:nth-child(4) { animation-delay: .15s; }

  /* ── Transpose row ── */
  .transpose-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .arrow-group {
    display: flex;
    gap: 6px;
  }

  .arrow-btn {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: .9rem;
    width: 40px;
    height: 40px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    display: flex; align-items: center; justify-content: center;
  }

  .arrow-btn:hover { background: #1e1e30; border-color: var(--accent2); transform: scale(1.08); }
  .arrow-btn:active { transform: scale(.95); }

  .semitone-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--accent);
    min-width: 56px;
    text-align: center;
    letter-spacing: .05em;
  }

  .reset-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: .7rem;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: .1em;
    transition: border-color .15s, color .15s;
    margin-left: auto;
  }

  .reset-btn:hover { border-color: var(--accent2); color: var(--text); }

  /* ── Textarea ── */
  textarea {
    width: 100%;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: clamp(.8rem, 2.2vw, .95rem);
    line-height: 1.9;
    padding: 16px;
    resize: vertical;
    min-height: 140px;
    outline: none;
    transition: border-color .2s;
    letter-spacing: .03em;
  }

  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-color: var(--accent2); }

  /* ── Output ── */
  .output-box {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    min-height: 140px;
    font-size: clamp(.8rem, 2.2vw, .95rem);
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: .03em;
    color: var(--text);
    position: relative;
    transition: border-color .2s;
  }

  .output-box .chord-token {
    color: var(--accent);
    font-weight: 500;
    transition: color .2s;
  }

  .copy-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: .65rem;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: .1em;
    transition: border-color .15s, color .15s;
  }

  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { color: #5fda8f; border-color: #5fda8f; }

  /* ── Two-col key+target layout ── */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 520px) {
    .two-col { grid-template-columns: 1fr; }
    .key-grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
  }

  /* ── Dot indicator ── */
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .3; }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tag {
    display: inline-block;
    background: rgba(232,197,71,.12);
    border: 1px solid rgba(232,197,71,.25);
    color: var(--accent);
    font-size: .6rem;
    letter-spacing: .15em;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Chord<br>Transposer</h1>
    <p class="sub">paste · pick · play</p>
  </header>

  <!-- Input -->
  <div class="card">
    <p class="section-label"><span class="dot"></span>Your Chords</p>
    <textarea id="inputArea" placeholder="Am  F  C  G&#10;Capo 2&#10;[Verse]&#10;Am  F&#10;C  G  Em"></textarea>
  </div>

  <!-- From / To Keys -->
  <div class="card">
    <div class="two-col">
      <div>
        <p class="section-label">Original Key</p>
        <div class="key-grid" id="fromGrid"></div>
      </div>
      <div>
        <p class="section-label">Target Key</p>
        <div class="key-grid" id="toGrid"></div>
      </div>
    </div>
  </div>

  <!-- Fine-tune semitones -->
  <div class="card">
    <p class="section-label">Fine-tune (semitones)</p>
    <div class="transpose-row">
      <div class="arrow-group">
        <button class="arrow-btn" id="downBtn">−</button>
        <button class="arrow-btn" id="upBtn">+</button>
      </div>
      <span class="semitone-display" id="semiDisplay">0 st</span>
      <button class="reset-btn" id="resetBtn">RESET</button>
    </div>
  </div>

  <!-- Output -->
  <div class="card">
    <p class="section-label">Transposed <span class="tag" id="resultTag">—</span></p>
    <div class="output-box" id="outputBox">
      <button class="copy-btn" id="copyBtn">COPY</button>
      <span id="outputText" style="display:block;min-height:80px;"></span>
    </div>
  </div>

</div>

<script>
/*
 * Chord Transposer
 * ----------------
 * Wrapped in an IIFE (strict mode) so nothing leaks to the global scope.
 * Two clearly separated layers:
 *   1. PURE CORE   – music-theory functions; no DOM, fully testable.
 *   2. VIEW / WIRING – cached DOM refs, a single render(), event handlers.
 */
(function () {
  'use strict';

  /* ───────────────────────── Music data & constants ───────────────────────── */
  const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

  // Keys shown in the From/To pickers.
  const KEYS = [
    'C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'
  ];

  // Keys whose conventional spelling uses flats.
  const FLAT_KEYS = ['F','Bb','Eb','Ab','Db','Gb'];

  const OCTAVE = 12;             // semitones per octave
  const TRITONE = 6;            // half an octave — pivot for choosing transposition direction
  const CHORD_LINE_RATIO = 0.5; // ≥ this fraction of chord tokens ⇒ treat the line as a chord line
  const COPY_RESET_MS = 1800;   // how long the "DONE!" copy confirmation stays up

  /*
   * Single source of truth for chord matching.
   *  - STRICT_CHORD_RE validates a *whole* token: root + recognised quality
   *    atoms + optional slash bass, anchored end-to-end. This keeps ordinary
   *    words that merely start with A–G (e.g. "Capo", "Bridge") from being
   *    mistaken for chords.
   *  - CHORD_CANDIDATE_RE finds chord-shaped substrings inside lyric lines;
   *    every hit is then re-validated with parseChord().
   */
  const ROOT = '[A-G][#b]?';
  const CHORD_SUFFIX =
    '(?:maj|min|sus|add|aug|dim|hdim|alt|M|m|°|ø|Δ|\\+|13|11|9|7|6|5|4|2|b5|#5|b9|#9|#11|b13|b6)';
  const STRICT_CHORD_RE = new RegExp('^(' + ROOT + ')' + CHORD_SUFFIX + '*(?:/' + ROOT + ')?$');
  const CHORD_CANDIDATE_RE =
    /\b([A-G][#b]?(?:m(?:aj)?7?|maj7?|7|9|11|13|sus[24]?|add9|dim7?|aug|6|b5|#5|\+)?(?:\/[A-Gb#]{1,2}b?)?)\b/g;

  /* ─────────────────────────────── Pure core ──────────────────────────────── */
  const escHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Chromatic index 0–11 for a note, or -1 for spellings we don't represent (Cb, E#, …).
  function noteIndex(note) {
    const i = SHARPS.indexOf(note);
    return i < 0 ? FLATS.indexOf(note) : i;
  }

  const bestNote = (idx, useFlat) => (useFlat ? FLATS[idx] : SHARPS[idx]);
  const preferFlat = (key) => FLAT_KEYS.includes(key);

  // Parse a single token → { root, suffix } or null. A token is a chord only if
  // it matches the strict grammar AND its root is a representable note.
  function parseChord(token) {
    const m = STRICT_CHORD_RE.exec(token);
    if (!m) return null;
    const root = m[1];
    if (noteIndex(root) < 0) return null;
    return { root, suffix: token.slice(root.length) };
  }

  function transposeChord(token, semitones, useFlat) {
    // Slash chords: transpose the upper chord and the bass note independently.
    const slash = token.match(/^([A-G][#b]?.*?)\/([A-G][#b]?)$/);
    if (slash) {
      return transposeChord(slash[1], semitones, useFlat) + '/' +
             transposeChord(slash[2], semitones, useFlat);
    }
    const parsed = parseChord(token);
    if (!parsed) return token;
    const idx = noteIndex(parsed.root);
    if (idx < 0) return token;
    const newIdx = ((idx + semitones) % OCTAVE + OCTAVE) % OCTAVE;
    return bestNote(newIdx, useFlat) + parsed.suffix;
  }

  // Transpose a whole sheet. Returns { html, plain } so the view can render
  // highlighted output while the copy button gets clean text.
  function transposeText(text, semitones, toKey) {
    const useFlat = toKey ? preferFlat(toKey) : false;
    if (semitones === 0) return { html: escHtml(text), plain: text };

    const htmlLines = [];
    const plainLines = [];

    for (const line of text.split('\n')) {
      const tokens = line.split(/(\s+)/);

      // A line is a "chord line" when most of its words parse as chords.
      let chordCount = 0, wordCount = 0;
      for (const t of tokens) {
        if (!t.trim()) continue;
        wordCount++;
        if (parseChord(t)) chordCount++;
      }
      const isChordLine = wordCount > 0 && chordCount / wordCount >= CHORD_LINE_RATIO;

      if (isChordLine) {
        // Transpose every chord token; pass whitespace and non-chords through.
        const html = [];
        const plain = [];
        for (const t of tokens) {
          if (!t.trim() || !parseChord(t)) {
            html.push(escHtml(t));
            plain.push(t);
            continue;
          }
          const transposed = transposeChord(t, semitones, useFlat);
          html.push(`<span class="chord-token">${escHtml(transposed)}</span>`);
          plain.push(transposed);
        }
        htmlLines.push(html.join(''));
        plainLines.push(plain.join(''));
      } else {
        // Lyric line: only replace chord-shaped substrings that re-validate.
        let html = '';
        let plain = '';
        let last = 0;
        for (const m of line.matchAll(CHORD_CANDIDATE_RE)) {
          if (!parseChord(m[1])) continue;
          const before = line.slice(last, m.index);
          const transposed = transposeChord(m[1], semitones, useFlat);
          html += escHtml(before) + `<span class="chord-token">${escHtml(transposed)}</span>`;
          plain += before + transposed;
          last = m.index + m[0].length;
        }
        html += escHtml(line.slice(last));
        plain += line.slice(last);
        htmlLines.push(html);
        plainLines.push(plain);
      }
    }
    return { html: htmlLines.join('\n'), plain: plainLines.join('\n') };
  }

  /* ───────────────────────────── View / state ─────────────────────────────── */
  const dom = {
    input:  document.getElementById('inputArea'),
    output: document.getElementById('outputText'),
    semi:   document.getElementById('semiDisplay'),
    tag:    document.getElementById('resultTag'),
    copy:   document.getElementById('copyBtn'),
    up:     document.getElementById('upBtn'),
    down:   document.getElementById('downBtn'),
    reset:  document.getElementById('resetBtn'),
  };

  const state = { fromKey: null, toKey: null, manualSemitones: 0 };
  let outputPlain = ''; // clean text mirror of the rendered output, for copying

  // Net shift = shortest path between the two keys (if both set) + manual offset.
  function totalSemitones() {
    let base = 0;
    if (state.fromKey && state.toKey) {
      const fi = noteIndex(state.fromKey), ti = noteIndex(state.toKey);
      if (fi >= 0 && ti >= 0) base = ((ti - fi) % OCTAVE + OCTAVE) % OCTAVE;
      if (base > TRITONE) base -= OCTAVE; // prefer the shorter direction
    }
    return base + state.manualSemitones;
  }

  function render() {
    const semi = totalSemitones();
    const { html, plain } = transposeText(dom.input.value, semi, state.toKey || state.fromKey);
    dom.output.innerHTML = html;
    outputPlain = plain;

    dom.semi.textContent = (semi >= 0 ? '+' : '') + semi + ' st';
    if (state.toKey) {
      dom.tag.textContent = state.toKey;
    } else if (semi !== 0) {
      dom.tag.textContent = (semi > 0 ? '+' : '') + semi + ' semitone' + (Math.abs(semi) !== 1 ? 's' : '');
    } else {
      dom.tag.textContent = '—';
    }
  }

  /* ───────────────────────────── Key grids ────────────────────────────────── */
  function buildGrid(id, type) {
    const grid = document.getElementById(id);
    for (const k of KEYS) {
      const btn = document.createElement('button');
      btn.className = 'key-btn';
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => {
        grid.querySelectorAll('.key-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        if (type === 'from') {
          state.fromKey = k;
        } else {
          state.toKey = k;
          state.manualSemitones = 0;
        }
        render();
      });
      grid.appendChild(btn);
    }
  }

  buildGrid('fromGrid', 'from');
  buildGrid('toGrid', 'to');

  /* ───────────────────────────── Controls ─────────────────────────────────── */
  dom.up.addEventListener('click', () => { state.manualSemitones++; render(); });
  dom.down.addEventListener('click', () => { state.manualSemitones--; render(); });
  dom.reset.addEventListener('click', () => {
    state.manualSemitones = 0;
    state.fromKey = null;
    state.toKey = null;
    document.querySelectorAll('.key-btn').forEach((b) => b.classList.remove('active'));
    render();
  });
  dom.input.addEventListener('input', render);

  dom.copy.addEventListener('click', () => {
    const text = outputPlain || dom.output.innerText;
    navigator.clipboard.writeText(text).then(() => {
      dom.copy.textContent = 'DONE!';
      dom.copy.classList.add('copied');
      setTimeout(() => { dom.copy.textContent = 'COPY'; dom.copy.classList.remove('copied'); }, COPY_RESET_MS);
    });
  });

  // Initial paint
  render();
})();
</script>
</body>
</html>
