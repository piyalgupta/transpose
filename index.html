<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Transposer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --panel: #1a1a26;
    --border: #2a2a3a;
    --accent: #e8c547;
    --accent2: #7c6ef5;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --radius: 10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(16px, 4vw, 40px) clamp(12px, 4vw, 32px);
    overflow-x: hidden;
  }

  /* Subtle grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,110,245,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,110,245,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 820px;
  }

  header {
    text-align: center;
    margin-bottom: clamp(24px, 5vw, 48px);
    animation: fadeDown .5s ease both;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 8vw, 6rem);
    letter-spacing: .06em;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent) 0%, #fff 50%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sub {
    color: var(--muted);
    font-size: .75rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* ── Key Picker ── */
  .section-label {
    font-size: .65rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .key-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
    margin-bottom: 10px;
  }

  .key-btn {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: .8rem;
    padding: 10px 6px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .12s, color .15s;
    text-align: center;
    user-select: none;
    line-height: 1.2;
  }

  .key-btn:hover {
    background: #1e1e30;
    border-color: var(--accent2);
    transform: translateY(-2px);
  }

  .key-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
    font-weight: 500;
    transform: translateY(-2px);
    box-shadow: 0 0 16px rgba(232,197,71,.35);
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: clamp(16px, 4vw, 28px);
    margin-bottom: 20px;
    animation: fadeUp .4s ease both;
  }

  .card:nth-child(2) { animation-delay: .05s; }
  .card:nth-child(3) { animation-delay: .1s; }
  .card:nth-child(4) { animation-delay: .15s; }

  /* ── Transpose row ── */
  .transpose-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .arrow-group {
    display: flex;
    gap: 6px;
  }

  .arrow-btn {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: .9rem;
    width: 40px;
    height: 40px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    display: flex; align-items: center; justify-content: center;
  }

  .arrow-btn:hover { background: #1e1e30; border-color: var(--accent2); transform: scale(1.08); }
  .arrow-btn:active { transform: scale(.95); }

  .semitone-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--accent);
    min-width: 56px;
    text-align: center;
    letter-spacing: .05em;
  }

  .reset-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: .7rem;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: .1em;
    transition: border-color .15s, color .15s;
    margin-left: auto;
  }

  .reset-btn:hover { border-color: var(--accent2); color: var(--text); }

  /* ── Textarea ── */
  textarea {
    width: 100%;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: clamp(.8rem, 2.2vw, .95rem);
    line-height: 1.9;
    padding: 16px;
    resize: vertical;
    min-height: 140px;
    outline: none;
    transition: border-color .2s;
    letter-spacing: .03em;
  }

  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-color: var(--accent2); }

  /* ── Output ── */
  .output-box {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    min-height: 140px;
    font-size: clamp(.8rem, 2.2vw, .95rem);
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: .03em;
    color: var(--text);
    position: relative;
    transition: border-color .2s;
  }

  .output-box .chord-token {
    color: var(--accent);
    font-weight: 500;
    transition: color .2s;
  }

  .copy-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: .65rem;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: .1em;
    transition: border-color .15s, color .15s;
  }

  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { color: #5fda8f; border-color: #5fda8f; }

  /* ── Two-col key+target layout ── */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 520px) {
    .two-col { grid-template-columns: 1fr; }
    .key-grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
  }

  /* ── Dot indicator ── */
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .3; }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tag {
    display: inline-block;
    background: rgba(232,197,71,.12);
    border: 1px solid rgba(232,197,71,.25);
    color: var(--accent);
    font-size: .6rem;
    letter-spacing: .15em;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Chord<br>Transposer</h1>
    <p class="sub">paste · pick · play</p>
  </header>

  <!-- Input -->
  <div class="card">
    <p class="section-label"><span class="dot"></span>Your Chords</p>
    <textarea id="inputArea" placeholder="Am  F  C  G&#10;Capo 2&#10;[Verse]&#10;Am  F&#10;C  G  Em"></textarea>
  </div>

  <!-- From / To Keys -->
  <div class="card">
    <div class="two-col">
      <div>
        <p class="section-label">Original Key</p>
        <div class="key-grid" id="fromGrid"></div>
      </div>
      <div>
        <p class="section-label">Target Key</p>
        <div class="key-grid" id="toGrid"></div>
      </div>
    </div>
  </div>

  <!-- Fine-tune semitones -->
  <div class="card">
    <p class="section-label">Fine-tune (semitones)</p>
    <div class="transpose-row">
      <div class="arrow-group">
        <button class="arrow-btn" id="downBtn">−</button>
        <button class="arrow-btn" id="upBtn">+</button>
      </div>
      <span class="semitone-display" id="semiDisplay">0 st</span>
      <button class="reset-btn" id="resetBtn">RESET</button>
    </div>
  </div>

  <!-- Output -->
  <div class="card">
    <p class="section-label">Transposed <span class="tag" id="resultTag">—</span></p>
    <div class="output-box" id="outputBox">
      <button class="copy-btn" id="copyBtn">COPY</button>
      <span id="outputText" style="display:block;min-height:80px;"></span>
    </div>
  </div>

</div>

<script>
// ── Music data ──
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ENHARMONIC = { 'C#':'Db','Db':'C#','D#':'Eb','Eb':'D#','F#':'Gb','Gb':'F#','G#':'Ab','Ab':'G#','A#':'Bb','Bb':'A#' };

// Display keys
const KEYS = [
  'C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'
];

// Strict chord grammar: a root, followed only by recognised chord-quality
// atoms, with an optional slash-bass note. Anchored end-to-end so ordinary
// words that merely start with A–G (e.g. "Capo", "Bridge", "Cast") are NOT
// mistaken for chords.
const ROOT_RE = '[A-G][#b]?';
const CHORD_SUFFIX =
  '(?:maj|min|sus|add|aug|dim|hdim|alt|M|m|°|ø|Δ|\\+|13|11|9|7|6|5|4|2|b5|#5|b9|#9|#11|b13|b6)';
const STRICT_CHORD_RE = new RegExp('^' + ROOT_RE + CHORD_SUFFIX + '*(?:/' + ROOT_RE + ')?$');

function noteIndex(note) {
  let i = SHARPS.indexOf(note);
  if (i < 0) i = FLATS.indexOf(note);
  return i;
}

function bestNote(idx, useFlat) {
  return useFlat ? FLATS[idx] : SHARPS[idx];
}

function preferFlat(key) {
  return ['F','Bb','Eb','Ab','Db','Gb'].includes(key);
}

// Parse a single chord token → {root, suffix} or null.
// Rejects the token entirely unless it matches the strict chord grammar, so
// lyric/marker words are never transposed.
function parseChord(token) {
  if (!STRICT_CHORD_RE.test(token)) return null;
  const m = token.match(/^([A-G][#b]?)(.*)$/);
  const root = m[1];
  const suffix = m[2];
  if (noteIndex(root) < 0) return null;
  return { root, suffix };
}

// Regex that matches chord-like tokens
const CHORD_RE = /\b([A-G][#b]?(?:m(?:aj)?7?|maj7?|7|9|11|13|sus[24]?|add9|dim7?|aug|6|b5|#5|\+|°|ø|hdim)?(?:\/[A-Gb#]{1,2}b?)?)\b/g;

function transposeChord(token, semitones, useFlat) {
  // handle slash chords
  const slashMatch = token.match(/^([A-G][#b]?.*?)\/([A-G][#b]?)$/);
  if (slashMatch) {
    const top = transposeChord(slashMatch[1], semitones, useFlat);
    const bot = transposeChord(slashMatch[2], semitones, useFlat);
    return top + '/' + bot;
  }
  const parsed = parseChord(token);
  if (!parsed) return token;
  const idx = noteIndex(parsed.root);
  if (idx < 0) return token;
  const newIdx = ((idx + semitones) % 12 + 12) % 12;
  return bestNote(newIdx, useFlat) + parsed.suffix;
}

// Transpose entire text
function transposeText(text, semitones, toKey) {
  const useFlat = toKey ? preferFlat(toKey) : false;
  if (semitones === 0) return { html: escHtml(text), plain: text };

  // Split into lines, process tokens
  const lines = text.split('\n');
  const htmlLines = [];
  const plainLines = [];

  for (const line of lines) {
    // Detect chord lines: >50% tokens are chords
    const tokens = line.split(/(\s+)/);
    let chordCount = 0, wordCount = 0;
    for (const t of tokens) {
      if (!t.trim()) continue;
      wordCount++;
      if (parseChord(t)) chordCount++;
    }
    const isChordLine = wordCount > 0 && chordCount / wordCount >= 0.5;

    if (isChordLine) {
      const htmlParts = [];
      const plainParts = [];
      for (const t of tokens) {
        if (!t.trim()) { htmlParts.push(t); plainParts.push(t); continue; }
        const parsed = parseChord(t);
        if (parsed) {
          const transposed = transposeChord(t, semitones, useFlat);
          htmlParts.push(`<span class="chord-token">${escHtml(transposed)}</span>`);
          plainParts.push(transposed);
        } else {
          htmlParts.push(escHtml(t));
          plainParts.push(t);
        }
      }
      htmlLines.push(htmlParts.join(''));
      plainLines.push(plainParts.join(''));
    } else {
      // Inline chord replacement within lyrics like "Am F C G"
      let htmlLine = '';
      let plainLine = '';
      let last = 0;
      const re = /\b([A-G][#b]?(?:m(?:aj)?7?|maj7?|7|9|11|13|sus[24]?|add9|dim7?|aug|6|b5|#5|\+)?(?:\/[A-Gb#]{1,2}b?)?)\b/g;
      let rm;
      re.lastIndex = 0;
      // Only replace tokens that are valid chords
      const segments = [];
      while ((rm = re.exec(line)) !== null) {
        if (parseChord(rm[1])) segments.push({ start: rm.index, end: rm.index + rm[0].length, val: rm[1] });
      }
      last = 0;
      for (const seg of segments) {
        const before = line.slice(last, seg.start);
        const transposed = transposeChord(seg.val, semitones, useFlat);
        htmlLine += escHtml(before) + `<span class="chord-token">${escHtml(transposed)}</span>`;
        plainLine += before + transposed;
        last = seg.end;
      }
      htmlLine += escHtml(line.slice(last));
      plainLine += line.slice(last);
      htmlLines.push(htmlLine);
      plainLines.push(plainLine);
    }
  }
  return { html: htmlLines.join('\n'), plain: plainLines.join('\n') };
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── State ──
let fromKey = null;
let toKey = null;
let manualSemitones = 0;

function totalSemitones() {
  let base = 0;
  if (fromKey && toKey) {
    const fi = noteIndex(fromKey), ti = noteIndex(toKey);
    if (fi >= 0 && ti >= 0) base = ((ti - fi) % 12 + 12) % 12;
    if (base > 6) base -= 12; // shortest path
  }
  return base + manualSemitones;
}

function render() {
  const text = document.getElementById('inputArea').value;
  const semi = totalSemitones();
  const { html, plain } = transposeText(text, semi, toKey || fromKey);
  document.getElementById('outputText').innerHTML = html;
  window._outputPlain = plain;

  const st = semi;
  document.getElementById('semiDisplay').textContent = (st >= 0 ? '+' : '') + st + ' st';
  const tag = document.getElementById('resultTag');
  if (toKey) tag.textContent = toKey;
  else if (st !== 0) tag.textContent = (st > 0 ? '+' : '') + st + ' semitone' + (Math.abs(st) !== 1 ? 's' : '');
  else tag.textContent = '—';
}

// ── Key Grids ──
function buildGrid(id, type) {
  const grid = document.getElementById(id);
  KEYS.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'key-btn';
    btn.textContent = k;
    btn.dataset.key = k;
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (type === 'from') { fromKey = k; }
      else { toKey = k; manualSemitones = 0; }
      render();
    });
    grid.appendChild(btn);
  });
}

buildGrid('fromGrid', 'from');
buildGrid('toGrid', 'to');

// ── Controls ──
document.getElementById('upBtn').addEventListener('click', () => { manualSemitones++; render(); });
document.getElementById('downBtn').addEventListener('click', () => { manualSemitones--; render(); });
document.getElementById('resetBtn').addEventListener('click', () => {
  manualSemitones = 0;
  fromKey = null; toKey = null;
  document.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
  render();
});

document.getElementById('inputArea').addEventListener('input', render);

// ── Copy ──
document.getElementById('copyBtn').addEventListener('click', () => {
  const text = window._outputPlain || document.getElementById('outputText').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'DONE!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1800);
  });
});

// Initial render
render();
</script>
</body>
</html>
